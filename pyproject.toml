[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcmc-diagnostics"
version = "0.0.1"
license = { file = "LICENSE" }

description = "A package for diagnosing Markov Chain Monte Carlo (MCMC) chains for LBL neutrino experiments."

authors = [
    { name = "Artur Sztuc", email = "a.sztuc@ucl.ac.uk" }
]
maintainers = [
    { name = "Artur Sztuc", email = "a.sztuc@ucl.ac.uk" }
]

readme = "README.md"
keywords = ["MCMC", "diagnostics", "neutrino", "HEP", "physics"]

classifiers = [
  'Development Status :: 3 - Alpha',
  'Intended Audience :: Science/Research',
  'License :: OSI Approved :: MIT License',
  'Programming Language :: Python :: 3',
  'Programming Language :: Python :: 3.8',
  'Programming Language :: Python :: 3.9',
  'Programming Language :: Python :: 3.10',
  'Programming Language :: Python :: 3.11',
  'Programming Language :: Python :: 3.12',
  'Programming Language :: Python :: 3.13',
  'Programming Language :: Python :: 3.14',
  'Programming Language :: Python :: 3 :: Only',
  'Topic :: Scientific/Engineering :: Physics',
  'Operating System :: OS Independent'
]

requires-python = ">=3.8"
dependencies = [
    "numpy",
    "uproot",
    "matplotlib",
    "tqdm",
    "colorama",
    "argparse",
    "pandas",
    "seaborn"
]

[project.urls]
"Homepage" = "https://github.com/ArturSztuc/mcmc-diagnostics"
"Bug Tracker" = "https://github.com/ArturSztuc/mcmc-diagnostics/issues"